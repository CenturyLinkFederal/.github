name: Comprehensive Codebase Review
description: Comprehensive codebase, architecture, and pipeline review with modernization recommendations
title: "Comprehensive Codebase, Architecture, and Pipeline Review with Modernization Recommendations"
labels: ["review", "architecture", "ci-cd", "modernization"]
assignees:
  - copilot
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Purpose of this review
      value: |
        Direct an experienced principal software architect to perform a holistic assessment of this repository. Start by validating guardrails (confirm the repo contains source code and build tooling; stop and report if it is purely documentation). When the review proceeds, require proportional coverage for each primary language or framework, ensure all outputs live under a `copilot-eval` folder, and capture actionable modernization guidance together with risks and remediation next steps.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Areas to be analyzed
      value: |
        - Guardrails: Ignore any previously generated artifacts under copilot-eval and treat the analysis as starting from scratch based on the current code in the repo. verify the repository includes executable source code plus build tooling (abort if only docs exist); acknowledge and cover each primary language or framework proportionally.
        - For non-UI repos check for the existence of a pom.xml in the root of the repo if there check for multiple modules listed as nodes under project/modules.  If multiple modules exist treat each as its own report with individualized reports within all of the artifacts generated.  When scoring take an average of the scores across the modules discovered to arrive at repo level score for each of the scoring criteria. The scoring table generated in scoring.md ***must*** follow standard column structure consistently generated for all repos - that means no dedicated column for individual modules just a score column with a number that is the calculated average of any modules evaluated.  If multiple modules exist with unique score present provide those score breakdown in an additional set of unique tables further down in the scoring.md.
        - Repository intake: map structure, key modules and services, build systems, runtimes, deployment models, functional domains, and major entry points.
        - Code quality & best practices: evaluate architecture, patterns, strengths, anti-patterns, and model topologies with referenced evidence.
        - Dependency & API inventory: catalog external APIs/SDKs (purpose, usage) and third-party libraries/frameworks with versions and upgrade considerations.
        - Testing, security, performance, maintainability: assess strategy, coverage signals, vulnerabilities, compliance, performance factors, documentation, modularity, and onboarding friction.
        - CI/CD & operations: inspect pipelines, automation scripts, IaC, recurring failures, flaky tests, and recommend tooling reliability improvements.
        - Modernization roadmap: flag outdated platforms, suggest upgrade sequencing, quick wins, longer-term initiatives, and cost/impact rationale.
        - Scoring & reporting: assign 1-10 scores for required categories, produce a Mermaid architecture diagram, summarize open improvement issues with links and actions, and close with explicit stakeholder next steps.
        - AI adoption analysis: assess explicit AI-assisted commit activity for the last 6 months across all refs and what reached master, and generate the required markdown/csv deliverables under copilot-eval.
        - Special instructions: reference files by relative path, append `/copilot-eval` to `.prettierignore` if it exists, and ensure all artifacts reside under `copilot-eval/`.
        - Vue UI guidance: evaluate every view, page, and component against Chi component usage (web components or HTML boilerplate), treating the CDN-style script or stylesheet version declared in the primary HTML entrypoint as the canonical Chi release even if chi-vue packages differ.
        - Java logging guidance: audit logging statements for noisy or frivolous entries, confirm true exceptions log full stack context, and surface any swallowed errors.
    validations:
      required: true

  - type: textarea
    id: scoring
    attributes:
      label: Scoring Breakdown (1-10 scale)
      description: Score each category
      value: |
        | Category               | Score | Justification |
        |------------------------|-------|---------------|
        | Code Quality           |       |               |
        | Architecture           |       |               |
        | Testing                |       |               |
        | Security               |       |               |
        | Performance            |       |               |
        | Maintainability        |       |               |
        | CI/CD Pipeline         |       |               |
        | Documentation          |       |               |
        | Modernization          |       |               |
        | Dependencies           |       |               |
        | CHI Compliance (if applicable) |       |               |
        | Logging (if applicable)        |       |               |
        | AI Adoption           |       |               |

        *Provide a numeric score (1-10) and concise justification for every relevant dimension. Note conditional categories only when they apply.*
        *It is important this scoring is consistent with the detailed findings and justifications provided in the associated deliverables (e.g., chi-compliance.md should support the CHI Compliance score, logging-review.md should support the Logging score, etc.).*
        *It is imperative that the scoring table generated in scoring.md follows the standard column structure defined here and is generated consistently for all repos, with no deviations or dedicated columns for individual modules—only a numeric score in the score column. This table will be parsed by a report and must strictly adhere to this format for parsing to succeed.*
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      description: Expected outputs
      value: |
        - Narrative findings, strengths, risks → `copilot-eval/summary.md`
        - Architecture overview and functional summary → `copilot-eval/architecture.md`
        - Dependency and external API inventories → `copilot-eval/dependencies.md`
        - Model and data topology → `copilot-eval/model-topology.md`
        - CI/CD health, failure diagnostics, automation gaps → `copilot-eval/ci-cd.md`
        - Recommended code, pipeline, and automation improvements → `copilot-eval/improvements.md`
        - Modernization roadmap with prioritized actions → `copilot-eval/modernization.md`
        - Scoring table with 1-10 ratings and rationales → `copilot-eval/scoring.md`
        - Mermaid architecture diagram source → `copilot-eval/architecture.mmd`
        - Improvement-focused GitHub issue synopsis → `copilot-eval/improvement-issues.md`
        - AI adoption analysis narrative with adoption score, shipped-to-master breakdown, and recommendations (last 6 months) → `copilot-eval/ai-adoption.md`
        - AI adoption commit-level data for explicit AI-related commits (last 6 months) → `copilot-eval/ai-adoption.csv`
        - AI adoption aggregated per developer with normalized identities (last 6 months) → `copilot-eval/ai-adoption-by-developer.csv`
        - Chi design system compliance review (Vue UI only; analyze all views/pages/components, cite deviations, prioritize remediation steps, include a 1-10 compliance score, and base versioning on the CDN reference) → `copilot-eval/chi-compliance.md`
        - Logging practices review (Java code only; include a 1-10 logging hygiene score, highlight noisy/frivolous logs, confirm exceptions retain full stack traces, flag swallowed errors) → `copilot-eval/logging-review.md`

        Place every artifact inside `copilot-eval/`. If a `.prettierignore` file exists, append `copilot-eval` without removing existing entries. Close deliverables with clear next steps or stakeholder questions when risks remain.
    validations:
      required: true

  - type: textarea
    id: completeprompt
    attributes:
      label: Full Prompt
      description: The job to be done
      value: |
        You are an experienced principal software architect. Deliver a comprehensive review of the current repository and produce organized artifacts that capture findings, risks, and modernization opportunities.

        Guardrails:
        - Ignore any previously generated artifacts under copilot-eval and treat the analysis as starting from scratch based on the current code in the repo.
        - Verify that the repository contains source code and build tooling; if only documentation exists, stop and report that the review is out of scope.
        - If the repository spans multiple primary languages or frameworks, acknowledge each and cover them proportionally.
        - Always create or update a root folder named copilot-eval for all generated outputs.

        When the guardrails pass, complete the following:
        1. Repository Intake
          - Map the directory structure, key modules, services, and build systems.
          - Summarize runtime environments, targeted platforms, and deployment models.
          - Capture high-level functional domains and major entry points.
        2. Code Quality & Best Practices
          - Assess architecture, patterns, and code health per technology stack.
          - Highlight strengths and anti-patterns, with references to supporting files.
          - Inventory model objects and describe relationships in a dedicated topology.
        3. Dependency & API Inventory
          - List all external APIs, SDKs, and service integrations with purpose and usage locations.
          - Enumerate third-party libraries and frameworks with versions and upgrade risks.
        4. Testing, Security, Performance, Maintainability
          - Evaluate test strategy, coverage signals, and gaps.
          - Identify security controls, vulnerabilities, and compliance concerns.
          - Review performance considerations (profiling artifacts, caching, load handling).
          - Comment on maintainability factors such as modularity, documentation, and onboarding friction.
        5. CI/CD & Operations
          - Analyze build pipelines, automation scripts, and infrastructure-as-code assets.
          - Diagnose repeated CI/CD failures or flaky tests with root cause hypotheses.
          - Recommend modernization or reliability improvements for tooling and workflows.
          - If this repository contains a `ply` directory under `test/` or a similar location, note that `ply` is an internal integration testing tool (see https://ply-ct.org/ply/). When evaluating integration testing, inspect the `ply` directory for existing tests.
        6. Modernization Roadmap
          - Analyze all languages, frameworks, and infrastructure components.
          - For each, determine: current version, release status (stable/LTS, milestone, snapshot, rc).
          - Flag and prioritize:
              - Outdated versions: below latest LTS/stable → recommend upgrade.
              - Pre-release/unstable versions: milestone/snapshot/rc → recommend downgrade to latest stable/LTS.
              - Stable/LTS versions: mark as modern/production-ready.
          - Provide clear upgrade/downgrade migration paths.
          - Sequence modernization tasks for maximum stability and safety:
              1. Replace pre-release/milestone/snapshot dependencies with latest stable/LTS versions.
              2. Upgrade outdated dependencies.
              3. Enhance with resilience, observability, and performance.
          - Justify recommendations: explain risks and benefits for each change.
          - List quick wins for stabilization and security, and note longer-term investments.
        7. Scoring & Reporting
          - Score each dimension (Code Quality, Architecture, Testing, Security, Performance, Maintainability, CI/CD Pipeline, Documentation, Modernization, Dependencies, CHI compliance (if applicable), logging (if applicable), AI Adoption) on a 1-10 scale with brief justification.
          - Generate a Mermaid diagram that visualizes the current system architecture and key interactions.
          - Summarize open GitHub issues related to improvements with reference links and recommended next actions.

        Deliverables (all under copilot-eval/):
        - summary.md — narrative findings, strengths, and concerns.
        - architecture.md — high-level architecture document and functional summary.
        - dependencies.md — API and library dependency inventories.
        - model-topology.md — organized object and data model topology.
        - ci-cd.md — pipeline health assessment and failure analysis.
        - improvements.md — recommended code, pipeline, and automation enhancements.
        - modernization.md — modernization recommendations and prioritized roadmap.
        - scoring.md — tabular scoring with 1-10 ratings and justifications.
        - architecture.mmd — Mermaid diagram source for the architecture.
        - improvement-issues.md — synopsis of open improvement-focused GitHub issues with solution steps.
        - ai-adoption.md — explicit AI adoption analysis for the last 6 months with an executive judgment (low/moderate/high), score, shipped-to-master section, contributor/subsystem adoption analysis, **squashed commits analysis**, non-adopter table, next steps, and caveats.
        - ai-adoption.csv — commit-level explicit AI-related commits in the last 6 months with columns: sha, date, author, normalized_author, subject, on_master, files_changed, top_level_area, dominant_subsystem, dominant_file, squash_merge_indicator, signal_type (explicit_keyword | github_metadata | git_hook | implicit_pattern).
        - ai-adoption-by-developer.csv — developer aggregation from ai-adoption.csv with columns: developer, total_ai_commits, ai_commits_on_master, ai_commits_off_master, master_commit_share_pct.
        - chi-compliance.md — generated only when the repository includes a Vue-based UI; 
          * FIRST, check index.html for Chi CDN references (CSS/JS URLs) - this is the authoritative Chi version
          * Report the Chi version from index.html CDN URLs (e.g., https://lib.lumen.com/chi/5.78.0/chi-portal.css)
          * Explicitly state Chi is CDN-loaded, NOT an npm package
          * Report the exact @centurylinkfederal/eis-vue version from package-lock.json by searching for "node_modules/@centurylinkfederal/eis-vue" and extracting the "version" field
          * Include both npm package versions (@centurylink/chi-vue) and the CDN-loaded Chi version separately
          * evaluate every view, page, and component for adherence to the Chi design system (https://assets.ctl.io/chi/5.78.0/getting-started/?theme=Portal) using any of these valid implementation patterns: 1. Chi HTML Blueprint - Using Chi CSS classes (.chi-data-table, .chi-button, etc.) with proper HTML/div structure as documented at https://assets.ctl.io/chi/5.78.0/getting-started/ 2. Chi Web Components - Using Chi's custom elements (<chi-button>, <chi-modal>, etc.) 3. Chi Vue Components - Using Vue wrappers from @centurylink/chi-vue package (ChiDataTable, ChiButton, etc.). Score compliance based on correct usage of ANY of these patterns. Flag as non-compliant only when components bypass Chi entirely with custom implementations. For partially compliant, note when a component uses one Chi pattern (e.g., CSS classes) but could benefit from a higher-level pattern (e.g., Vue component) for better maintainability., catalog deviations, and prioritize remediation steps before upgrading the Chi version.  Generate a score 1-10 for this as well. In the package.json also ensure the semver reference to @centurylinkfederal/eis-vue is using ~ instead of ^ to ensure only patch versions are updated to avoid minor version change issues, for example correct is "@centurylinkfederal/eis-vue": "~1.2.148" and incorrect is "@centurylinkfederal/eis-vue": "^1.2.148".
          * MUST DO: We need a time measureable estimate of how long it will take to become 100% chi compliant in this repo.  Generate a specific "Remediation Plan" section with a breakdown of the level of effort (human developer based time-estimates) necessary to reach 100% compliance and address all issues you've discovered plus a 20% padding. Present a phased prioritized plan along with detailed LOEs for each work item.  Take into consideration effort, impact, and priority.  Include a summary of the total LOE at the top of the document and in the Remediation Plan section.  I would expect this estimate to remain consistent and accurate each time this prompt is run based on the current state of the repo. Absolutely required is a high level summation of the level of effort in two-week sprints (with support developer hours) so we can plan to do the work. We do 2 week sprints and would like an estimate of how many sprint it will take to make this repo 100% chi compliant.
        - logging-review.md — generated only when the repository contains Java code; inspect logging usage for noisy or frivolous events, confirm true exceptions include full stack context, and flag swallowed errors. Generate a score 1-10 for this as well. Logging issues found within tests should still mentioned at the bottom of the artifact, but not prioritized.

        Additional Instructions:
        - Reference specific files with relative paths when citing evidence.
        - If a .prettierignore file exists, append copilot-eval to the ignore list without removing existing entries.
        - Close with explicit next steps or questions for stakeholders when risks remain unresolved.
        - AI Adoption Report Requirements (last 6 months, output to copilot-eval):
          * Analyze commits from now minus 6 months through today.
          * Include all refs for contribution analysis, and separately analyze what reached master.
          * **Signal Detection Strategy** (multiple layers to reduce developer friction):
              1. Explicit AI Keywords (optional, zero friction if auto-tagged): Treat commit subjects containing (case-insensitive): copilot, @Copilot, ai-assisted, gpt, claude, cursor.
              2. GitHub Copilot Attribution Metadata: If available, detect commits tagged with GitHub's AI-generated indicator (via GitHub API or webhook metadata).
              3. Git Hooks (recommended for ease-of-use): If the repo includes a `.githooks/prepare-commit-msg` hook or similar, document its presence and how it auto-tags AI commits without developer intervention.
              4. IDE/CLI Integration: Note if the codebase uses Copilot CLI or IDE extensions that auto-append AI indicators at commit time (no developer action required).
              5. Implicit Patterns (fallback): Scan commit message structure for AI-generated patterns (e.g., structured formatting, typical Copilot phrasing, co-authored metadata like "Co-authored-by: GitHub Copilot").
              6. Squashed Commit Recovery: Extract AI signals from individual commits inside squashed merges using all methods above.
          * Recommended Setup for Minimal Developer Friction:
              - Use a git hook (prepare-commit-msg or commit-msg) to auto-detect and auto-tag AI commits at push time.
              - Example: `if git diff --cached | grep -q "^+.*TODO\|FIXME\|DEBUG"` or integrate with Copilot CLI for automatic detection.
              - Developers do nothing; the system tags automatically.
              - Provide a `.githooks/prepare-commit-msg` template in the repo README for teams to adopt.
          * If no automation in place, fall back to explicit keyword detection; but acknowledge this undercounts adoption.
          * Treat on_master as commit is an ancestor of master.
          * Treat content commit as files_changed > 0 and merge-only commit as files_changed = 0.
          * Gather baseline counts: total commits in 6 months (all refs) and total commits in 6 months on master.
          * **Squashed Commit Inspection** (critical for accurate adoption metrics):
              - For each *squash-merged PR commit* on master (typically a single-parent commit with subject like `... (#123)`), extract the PR number from the commit subject.
              - If PR metadata is available (GitHub API), list the PR's commits and scan each commit subject/body for AI signals (explicit keywords, metadata, patterns).
              - If PR metadata is not available locally, document that individual pre-squash commits cannot be reliably recovered from git history alone.
              - Attribute detected AI signals to the original PR commit authors (not the squash-merge author) when PR commit data is available.
              - Document the observed merge strategy (squash vs. merge vs. rebase) and any recovery limitations in the Caveats section.
              - For squashed commits with AI signals, preserve the original author/date and create a logical "unmerged" entry in ai-adoption.csv with the source commits listed in a supplementary column.
              - If PR metadata is available (GitHub API), cross-reference the PR number from the merge commit message to retrieve the full commit history before squashing.
              - Document merge strategy (squash vs. fast-forward vs. three-way merge) in the Caveats section and note any adoption metrics recovered from squashed commits.
          * Build ai-adoption.csv with one row per explicit AI-related commit (including unmerged squashed commits) and columns exactly: sha, date, author, normalized_author, subject, on_master, files_changed, top_level_area, dominant_subsystem, dominant_file, squash_merge_indicator (true/false), signal_type (explicit_keyword | github_metadata | git_hook | implicit_pattern).
          * Compute normalized_author by merging obvious aliases via shared email identity and clear name/username variants (e.g., corporate name vs GitHub handle), and document normalization caveat in markdown.
          * Build ai-adoption-by-developer.csv from ai-adoption.csv with columns exactly: developer, total_ai_commits, ai_commits_on_master, ai_commits_off_master, master_commit_share_pct.
          * Detect active contributors with zero explicit AI signal: all active contributors in 6 months minus normalized authors in ai-adoption.csv, and include commit counts for this group.
          * Avoid brittle one-liner heredocs in terminal; if scripting is needed, create small temporary scripts/files, run them, and clean up helper artifacts afterward.
          * ai-adoption.md must include: Executive Judgment (moderate/low/high) with rationale; Method with exact filter terms, timeframe, lower-bound caveat, **merge strategy discovery notes**, and **detection strategy used** (explicit keywords only vs. multi-signal); section #2 What Actually Shipped To master with counts and table (Date, Author, SHA short, Subject, Dominant subsystem, Files changed, Squash Indicator, Signal Type); section #3 Developer And Subsystem Adoption with normalized contributor counts and subsystem distribution; section All AI Contributions Per Developer sourced from ai-adoption-by-developer.csv (Developer, Total AI commits, AI commits on master, AI commits off master, master share); section Developers With 0 Explicit AI Assistance (Developer, six-month commit count, recommendation priority); **section Squashed Commits Analysis** with summary of recovered AI signals, original vs. merge authors, and files impacted; section Setup Recommendations (e.g., "Add git hooks for zero-friction auto-tagging"; section Next Steps; and section Caveats.
          * Quality bar: markdown numbers must reconcile with both CSVs and squashed commit inspection logs; use normalized identities for developer reporting; distinguish all AI contributions vs merged-to-master AI contributions; account for squashed commits when computing adoption rate; remove temporary helper artifacts; validate outputs are readable and error-free.
        - For Vue-based UI repositories, expand the analysis phase to review template markup across all views, pages, and components against Chi component guidance (web components or HTML boilerplate) and describe non-compliant patterns in chi-compliance.md.
        - When reporting Chi compliance, treat the version declared by the CDN-style script or stylesheet reference in the primary HTML entrypoint (for example, `<script src="https://lib.lumen.com/chi/5.78.0/js/chi.js" ...>`) as the authoritative design system version even if package.json or chi-vue dependencies specify different numbers.
        - For Java repositories, audit logging frameworks and statements to highlight excessive verbosity, missing stack traces, or swallowed exceptions and document findings in logging-review.md.
        - Ensure the scores calculated per category in the table match exactly with the scores reported per associated category detail deliverable.
        - **Squashed Commits & Merge Strategy Handling**: When ai-adoption.csv includes squashed commits, clearly document the merge strategy observed in the repository (e.g., "squash-and-merge", "conventional merge", "rebase-and-merge"), the proportion of commits squashed vs. merged linearly, and any assumptions made during individual commit extraction. Update adoption rates in ai-adoption.md to reflect both direct signals and recovered signals from squashed commits, with separate line items for each category.
        - **Zero-Friction AI Adoption Tracking**: To avoid burdening developers with manual tagging, prefer automated detection methods over explicit keywords. Order of detection preference: (1) GitHub Copilot metadata / API attribution, (2) Git hooks that auto-tag at commit time, (3) IDE/CLI integration auto-detection, (4) Implicit patterns in commit structure, (5) Explicit keywords as fallback. When setting up the analysis, check for existence of `.githooks/` or `.git/hooks/` directory and document any auto-tagging infrastructure. If no automation exists, recommend adding a `prepare-commit-msg` hook template to the repo README with instructions for developers to opt-in passively (hook runs automatically after commit, no manual action required). Report which detection methods were used and their coverage in the ai-adoption.md Method section.  
    validations:
      required: true

  - type: textarea
    id: additional-notes
    attributes:
      label: Additional Notes
      description: Add any specific areas of concern or focus for this review
      value: | 
        - Adapt the review depth to repository size: emphasize critical modules over exhaustive file-by-file narration.
        - Document any assumptions about infrastructure, environments, or integrations when artifacts are missing.
        - Prefer actionable modernization guidance with rationale, cost, and impact considerations.
      placeholder: Any specific technologies, patterns, or areas to prioritize...
    validations:
      required: false
